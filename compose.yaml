services:
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_DB: accounts
      POSTGRES_USER: accounts
      POSTGRES_PASSWORD: ${DB_PASSWORD:-accounts-local}
    ports: ["5434:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  pgadmin:
    image: dpage/pgadmin4:8.13
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.local
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin-local}
    ports: ["5050:80"]
  axonserver:
    image: axoniq/axonserver:2024.2.4
    environment:
      AXONIQ_AXONSERVER_STANDALONE: 'true'
    ports: ["8024:8024", "8124:8124"]
    volumes: ["axondata:/axonserver/data", "axonevents:/axonserver/events"]
volumes:
  pgdata:
  axondata:
  axonevents:
